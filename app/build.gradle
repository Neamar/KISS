plugins {
    id 'com.android.application'
    id 'net.ltgt.errorprone'
}

android {
    buildFeatures {
        buildConfig = true
    }

    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId 'fr.neamar.kiss'
        minSdk {
            version = release(21)
        }
        targetSdk {
            version = release(36)
        }
        versionCode 224
        versionName "3.26.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            applicationIdSuffix ".debug"
        }
        instrumentation {
            initWith debug
            // The test runner uses Kotlin classes that are otherwise removed from the app.
            minifyEnabled false
            shrinkResources = false
        }
    }

    testBuildType "instrumentation"

    sourceSets {
        instrumentation.res.srcDir 'src/debug/res'
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    lint {
        checkAllWarnings = true
        lintConfig = file('lint.xml')
    }

    testOptions {
        animationsDisabled = false
        unitTests {
            all {
                testLogging {
                    exceptionFormat = "full"
                }
            }
        }
    }

    namespace = 'fr.neamar.kiss'
}

androidComponents {
    // Keep the documented debug unit-test task when device tests use instrumentation.
    beforeVariants(selector().withBuildType("debug")) { variantBuilder ->
        variantBuilder.enableUnitTest = true
    }
}

dependencies {
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")

    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'

    implementation 'androidx.annotation:annotation:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.fragment:fragment:1.8.9'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.hamcrest:hamcrest-library:3.0'

    errorprone('com.google.errorprone:error_prone_core:2.50.0')
    runtimeOnly('com.google.errorprone:error_prone_annotations:2.50.0')
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        disableWarningsInGeneratedCode = true
        disable('MissingOverride')
        disable('MissingSummary')
        disable('EmptyBlockTag')
        disable('EmptyCatch')
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
