name: Upload app to releases

# https://docs.github.com/en/webhooks/webhook-events-and-payloads#release
on:
  release:
    types: [edited, published]

concurrency:
  # Concurrency group that uses the workflow name and PR number if available
  # or commit SHA as a fallback. If a new workflow is triggered under that
  # concurrency group while a previous workflow is running it will be canceled.
  group: ${{ github.workflow }}-${{ github.ref || github.event.release.tag_name || github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # create app and upload it to the published release
  upload:
    runs-on: ubuntu-latest
    env:
      ARCHIVE_NAME: ${{ github.event.repository.name }}-${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Create Release Directory
        run: mkdir -p release

      - name: Validate
        run: |
          bash ./gradlew lint --stacktrace
          bash ./gradlew testDebugUnitTest --stacktrace

      - name: Build APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bash ./gradlew assembleRelease --stacktrace
          cp "app/build/outputs/apk/release/app-release.apk" "release/${ARCHIVE_NAME}.apk"

      - name: Upload Files
        run: >
          gh release upload
          --clobber "${{ github.event.release.tag_name }}"
          --repo "${{ github.repository }}"
          release/*
